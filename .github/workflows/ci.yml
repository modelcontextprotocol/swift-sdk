name: CI

# Every job is a line of scripts/ci/jobs, run through scripts/ci/run-jobs.sh, so a
# job is added or changed in one place.

on:
  push:
    branches: ["main", "rel/**"]
  pull_request:
    branches: ["main", "rel/**"]

# Actions are pinned by commit; the comment names the release.
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # macOS uses the Swift toolchain bundled with Xcode: a standalone toolchain
          # cannot build against a newer Xcode's macOS SDK.
          # Pinned leg: Xcode 16.3 ships Swift 6.1, matching the Linux job.
          - os: macos-15
            xcode: "16.3"
            swift-version: 6.1 (Xcode 16.3)
          # Current leg: catches breakage from new Xcode and SDK releases.
          - os: macos-latest
            swift-version: Xcode default
          - os: ubuntu-latest
            container: swift:6.1-rhel-ubi9
            swift-version: "6.1 (RHEL UBI 9)"
          - os: ubuntu-latest
            container: swift:6.1-noble
            swift-version: "6.1 (Ubuntu 24.04)"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Test (${{ matrix.os }}, Swift ${{ matrix.swift-version }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        if: matrix.xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Build, test, and run the hello example
        run: scripts/ci/run-jobs.sh build-test

  documentation:
    name: Documentation
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: DocC and weave check
        run: scripts/ci/run-jobs.sh docs

  # Every conformance leg and tier score, baseline-enforced, on macOS and on Linux
  # (RHEL UBI 9 and Ubuntu 24.04). The baselines are shared.
  conformance:
    name: Conformance (${{ matrix.os }}${{ matrix.container && format(', {0}', matrix.container) || '' }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.1-rhel-ubi9
          - os: ubuntu-latest
            container: swift:6.1-noble
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'macOS'
        with:
          node-version: "22"
      - name: Run conformance
        run: scripts/ci/run-jobs.sh --strict --timeout 20 'conformance-.*' 'tier-.*'
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ matrix.os }}-${{ strategy.job-index }}
          path: .build/conformance/
          if-no-files-found: ignore

  # The matrix must match interop/RESULTS.md on macOS and on Linux. On Linux,
  # scripts/ci/lib.sh installs Go and uv with scripts/ci/deps-linux.sh.
  interop:
    name: Interop (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: swift:6.1-rhel-ubi9
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: runner.os == 'macOS'
        with:
          go-version: "1.25"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: runner.os == 'macOS'
      - name: Run interop
        run: scripts/ci/run-jobs.sh --strict interop
      - name: Upload interop report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interop-${{ matrix.os }}
          path: |
            .build/interop/report.md
            .build/interop/results/
            .build/interop/logs/
          if-no-files-found: ignore

  static-linux-sdk-build:
    name: Linux Static SDK Build (${{ matrix.swift-version }} - ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift-version:
          - 6.1.2
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift-version }}-noble
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install static SDK and build
        env:
          BUILD_FLAGS: ""
        run: |
          which curl || (apt -q update && apt -yq install curl)
          # Pinned commit of swiftlang/github-workflows (main on 2026-10-24).
          curl -sf --retry 3 https://raw.githubusercontent.com/swiftlang/github-workflows/87329d126a6992483ba89aabefa1eaef1e5b0aad/.github/workflows/scripts/install-and-build-with-sdk.sh | \
          bash -s -- --static --flags="$BUILD_FLAGS" ${{ matrix.swift-version }}
